name: Unit Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests in parallel (excluding Pebble integration tests)
        run: uv run pytest -v -n auto -m "not integration"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/
